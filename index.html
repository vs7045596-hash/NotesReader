<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>NotesBook — PCM Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div><div class="orb orb-a"></div><div class="orb orb-b"></div>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark">N</span><span>Notes<span>Book</span></span></a>
    <a class="admin-link" href="admin.html">Admin ↗</a>
  </header>

  <main class="home">
    <section class="hero">
      <div class="eyebrow">YOUR DIGITAL STUDY LIBRARY</div>
      <h1>Read your notes<br><em>like a real book.</em></h1>
      <p>Physics, Chemistry and Maths — beautifully organised, searchable and readable without downloading notes.</p>
      <div class="search-wrap">
        <span>⌕</span><input id="search" autocomplete="off" placeholder="Search chapter, topic or note…">
        <kbd>Ctrl K</kbd>
      </div>
    </section>

    <nav class="subjects" aria-label="Subjects">
      <button class="subject active" data-subject="all"><b>ALL</b><small>Library</small></button>
      <button class="subject" data-subject="physics"><b>⚡ PHYSICS</b><small>Concepts & formulas</small></button>
      <button class="subject" data-subject="chemistry"><b>◈ CHEMISTRY</b><small>Reactions & theory</small></button>
      <button class="subject" data-subject="maths"><b>∑ MATHS</b><small>Problems & methods</small></button>
    </nav>

    <section class="library">
      <div class="section-head"><div><span class="eyebrow">LIBRARY</span><h2 id="heading">All notes</h2></div><span id="count" class="count"></span></div>
      <div id="notes" class="notes-grid"></div>
      <div id="empty" class="empty" hidden>No notes match your search.</div>
    </section>
  </main>

  <footer>NotesBook · GitHub-powered study library</footer>
  <script src="app.js"></script>
</body>
</html>
