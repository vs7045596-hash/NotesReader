<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Notes Studio | 3D Interactive Reader</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lumina: {
              gold: '#fbbf24',
              accent: '#f59e0b',
              glow: '#d97706',
              dark: '#0f172a',
              card: 'rgba(15, 23, 42, 0.75)'
            }
          }
        }
      }
    }
  </script>

  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- StPageFlip Engine -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Glassmorphism & Lumina Glow Theme */
    body {
      background: radial-gradient(circle at top center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(251, 191, 36, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(251, 191, 36, 0.2);
    }

    .lumina-glow {
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
    }

    .lumina-glow-hover:hover {
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
    }

    /* Page styling - Removed vertical line shadow overlay */
    .page {
      background-color: #fdfbf7;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans select-none overflow-hidden">

  <header class="h-16 glass-nav px-6 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/30 text-amber-400 lumina-glow">
        <i data-lucide="sparkles" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 text-lg tracking-wide" id="doc-title">
          Lumina Reader
        </h1>
        <p class="text-[11px] text-amber-400/80 font-mono tracking-wider" id="doc-subtitle">Interactive PDF Reader</p>
      </div>
    </div>

    <!-- Controls & Actions -->
    <div class="flex items-center space-x-4">
      <div id="notes-dropdown-container" class="hidden">
        <select id="notes-select" class="bg-slate-900/90 border border-amber-500/30 text-amber-200 text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-amber-400 transition cursor-pointer">
          <!-- Dynamically populated from notes-data.json -->
        </select>
      </div>

      <button id="open-admin-btn" class="flex items-center space-x-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl transition-all duration-300 lumina-glow-hover transform hover:-translate-y-0.5">
        <i data-lucide="key" class="w-4 h-4"></i>
        <span>Admin Studio</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center relative p-4 overflow-hidden" id="main-viewport">
    
    <!-- Loading Screen -->
    <div id="loading-spinner" class="flex flex-col items-center justify-center space-y-4">
      <div class="relative w-14 h-14">
        <div class="absolute inset-0 border-4 border-amber-500/20 rounded-full"></div>
        <div class="absolute inset-0 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
      </div>
      <p class="text-xs text-amber-300/90 font-mono tracking-widest animate-pulse" id="loading-text">INITIALIZING LUMINA READER...</p>
    </div>

    <!-- Empty State Screen -->
    <div id="empty-state" class="hidden text-center max-w-md p-8 glass-card rounded-2xl border border-amber-500/20 shadow-2xl">
      <div class="w-16 h-16 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-amber-500/30 lumina-glow">
        <i data-lucide="book-open-check" class="w-8 h-8"></i>
      </div>
      <h3 class="text-amber-100 font-bold mb-2 text-lg">No Notes Available</h3>
      <p class="text-xs text-slate-300 mb-6 leading-relaxed">Publish your PDF notes directly to GitHub using the Admin Studio. Saved notes render instantly without downloads.</p>
      <button onclick="openAdminModal()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 text-xs font-bold py-3 rounded-xl transition hover:opacity-95 lumina-glow">
        Open Admin Studio
      </button>
    </div>

    <!-- Clean 3D Flipbook Container (No vertical spine lines) -->
    <div id="book-container" class="hidden relative">
      <div id="flipbook"></div>
    </div>
  </main>

  <footer id="reader-controls" class="h-16 glass-nav px-6 flex items-center justify-between z-20 shrink-0 hidden">
    <button id="prev-page-btn" class="flex items-center space-x-2 bg-slate-900/80 hover:bg-slate-800 text-amber-300 text-xs font-semibold px-4 py-2.5 rounded-xl transition border border-amber-500/20 hover:border-amber-500/40">
      <i data-lucide="chevron-left" class="w-4 h-4"></i>
      <span class="hidden sm:inline">Previous Page</span>
    </button>

    <div class="flex items-center space-x-4">
      <span id="page-counter" class="text-xs font-mono text-amber-400/90 bg-slate-950/80 px-4 py-1.5 rounded-xl border border-amber-500/20 shadow-inner">
        Page 1 of --
      </span>
      <button id="sound-toggle-btn" onclick="toggleSound()" class="p-2 rounded-xl bg-slate-900/80 text-amber-400 hover:text-amber-300 border border-amber-500/20 transition" title="Toggle Page Sound">
        <i data-lucide="volume-2" class="w-4 h-4" id="sound-icon"></i>
      </button>
    </div>

    <button id="next-page-btn" class="flex items-center space-x-2 bg-slate-900/80 hover:bg-slate-800 text-amber-300 text-xs font-semibold px-4 py-2.5 rounded-xl transition border border-amber-500/20 hover:border-amber-500/40">
      <span class="hidden sm:inline">Next Page</span>
      <i data-lucide="chevron-right" class="w-4 h-4"></i>
    </button>
  </footer>

  <div id="admin-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card rounded-2xl w-full max-w-md overflow-hidden shadow-2xl border border-amber-500/30">
      
      <!-- Modal Header -->
      <div class="p-5 border-b border-amber-500/20 flex items-center justify-between bg-slate-900/50">
        <div class="flex items-center space-x-2 text-amber-400">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
          <h2 class="font-bold text-amber-100 text-sm tracking-wide">Lumina Admin Studio</h2>
        </div>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-amber-300 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Password Gate Screen -->
      <div id="auth-gate" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Enter Admin Security Key</label>
          <input type="password" id="admin-pass-input" placeholder="Default: admin123" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-amber-200 focus:outline-none focus:border-amber-400 font-mono">
        </div>
        <button onclick="verifyAdminPass()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold text-xs py-3 rounded-xl transition hover:opacity-95 lumina-glow">
          Unlock Studio
        </button>
      </div>

      <!-- Persistent Admin Settings & Upload Form -->
      <div id="admin-form" class="p-6 space-y-4 hidden">
        <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl flex items-center justify-between text-xs">
          <span class="text-amber-300 font-mono">Credentials Saved</span>
          <button onclick="clearSavedCredentials()" class="text-[10px] text-amber-400 hover:underline">Clear Credentials</button>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">GitHub Repository (Owner/Repo)</label>
          <input type="text" id="gh-repo-input" placeholder="username/my-notes-repo" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-amber-200 font-mono focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">GitHub Personal Access Token (PAT)</label>
          <input type="password" id="gh-token-input" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-amber-200 font-mono focus:outline-none focus:border-amber-400">
        </div>

        <div class="border-t border-slate-800 pt-3">
          <label class="block text-xs font-semibold text-slate-300 mb-1">PDF Note Title</label>
          <input type="text" id="note-title-input" placeholder="e.g. Physics Chapter 3 Notes" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-amber-100 focus:outline-none focus:border-amber-400">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Choose PDF File</label>
          <input type="file" id="pdf-file-input" accept="application/pdf" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-amber-300 hover:file:bg-slate-700 cursor-pointer">
        </div>

        <div id="upload-status" class="text-xs text-center py-1 font-mono hidden"></div>

        <button id="commit-btn" onclick="commitToGithub()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold text-xs py-3 rounded-xl transition flex items-center justify-center space-x-2 lumina-glow">
          <i data-lucide="cloud-upload" class="w-4 h-4"></i>
          <span>Save & Sync to GitHub</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // PDF.js worker setup
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlipInstance = null;
    let soundEnabled = true;
    let notesDatabase = [];
    let currentNoteIndex = 0;

    // Web Audio Synthesizer for realistic page turn
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playFlipSound() {
      if (!soundEnabled) return;
      try {
        const bufferSize = audioCtx.sampleRate * 0.12;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 850;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      icon.setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
      lucide.createIcons();
    }

    // Load saved repository credentials automatically on startup
    window.addEventListener('DOMContentLoaded', async () => {
      const savedRepo = localStorage.getItem('lumina_repo') || '';
      const savedToken = localStorage.getItem('lumina_pat') || '';

      if (savedRepo) document.getElementById('gh-repo-input').value = savedRepo;
      if (savedToken) document.getElementById('gh-token-input').value = savedToken;

      await loadNotesData();
    });

    // Fetch notes-data.json published on GitHub
    async function loadNotesData() {
      showLoading(true, "LOADING PUBLISHED NOTES...");
      try {
        const res = await fetch('notes-data.json?t=' + Date.now());
        if (res.ok) {
          notesDatabase = await res.json();
          if (notesDatabase && notesDatabase.length > 0) {
            setupNotesDropdown();
            await renderNoteBook(notesDatabase[0]);
          } else {
            showEmptyState();
          }
        } else {
          showEmptyState();
        }
      } catch (err) {
        showEmptyState();
      }
    }

    function setupNotesDropdown() {
      const dropdown = document.getElementById('notes-select');
      const container = document.getElementById('notes-dropdown-container');
      dropdown.innerHTML = '';
      
      notesDatabase.forEach((note, idx) => {
        const option = document.createElement('option');
        option.value = idx;
        option.textContent = note.title;
        dropdown.appendChild(option);
      });

      container.classList.remove('hidden');
      dropdown.addEventListener('change', async (e) => {
        currentNoteIndex = parseInt(e.target.value);
        await renderNoteBook(notesDatabase[currentNoteIndex]);
      });
    }

    // Render Raw PDF onto Canvas (Clean page layout with no vertical center line)
    async function renderNoteBook(noteItem) {
      showLoading(true, `RENDERING '${noteItem.title.toUpperCase()}'...`);
      document.getElementById('doc-title').textContent = noteItem.title;
      document.getElementById('doc-subtitle').textContent = `Published: ${noteItem.date || 'Recent'}`;

      const flipbookContainer = document.getElementById('flipbook');
      flipbookContainer.innerHTML = '';

      try {
        const binaryString = atob(noteItem.pdfBase64.split(',')[1] || noteItem.pdfBase64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        const pdf = await pdfjsLib.getDocument({ data: bytes.buffer }).promise;
        const pageCount = pdf.numPages;

        for (let pageNum = 1; pageNum <= pageCount; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          pageDiv.appendChild(canvas);
          flipbookContainer.appendChild(pageDiv);
        }

        initStPageFlip();
        showLoading(false);
      } catch (err) {
        console.error(err);
        showEmptyState();
      }
    }

    function initStPageFlip() {
      if (pageFlipInstance) {
        pageFlipInstance.destroy();
      }

      const viewportWidth = document.getElementById('main-viewport').clientWidth;
      const isMobile = viewportWidth < 768;
      const bookWidth = isMobile ? Math.min(viewportWidth - 20, 420) : 460;
      const bookHeight = isMobile ? 580 : 660;

      pageFlipInstance = new St.PageFlip(document.getElementById('flipbook'), {
        width: bookWidth,
        height: bookHeight,
        size: "fixed",
        minWidth: 300,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1200,
        maxShadowOpacity: 0.25,
        showCover: true,
        mobileScrollSupport: false
      });

      const pages = document.querySelectorAll('.page');
      pageFlipInstance.loadFromHTML(pages);

      pageFlipInstance.on('flip', (e) => {
        playFlipSound();
        updatePageCounter(e.data + 1, pageFlipInstance.getPageCount());
      });

      updatePageCounter(1, pageFlipInstance.getPageCount());
    }

    function updatePageCounter(current, total) {
      document.getElementById('page-counter').textContent = `Page ${current} of ${total}`;
    }

    // Controls
    document.getElementById('prev-page-btn').addEventListener('click', () => pageFlipInstance?.flipPrev());
    document.getElementById('next-page-btn').addEventListener('click', () => pageFlipInstance?.flipNext());

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') pageFlipInstance?.flipPrev();
      if (e.key === 'ArrowRight') pageFlipInstance?.flipNext();
    });

    // Admin Modal Logic
    function openAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    document.getElementById('open-admin-btn').addEventListener('click', openAdminModal);

    function verifyAdminPass() {
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === 'admin123' || pass === 'admin') {
        document.getElementById('auth-gate').classList.add('hidden');
        document.getElementById('admin-form').classList.remove('hidden');
      } else {
        alert('Incorrect Password!');
      }
    }

    function clearSavedCredentials() {
      localStorage.removeItem('lumina_repo');
      localStorage.removeItem('lumina_pat');
      document.getElementById('gh-repo-input').value = '';
      document.getElementById('gh-token-input').value = '';
      alert('Saved GitHub credentials cleared.');
    }

    // Direct Commit & Persistent Token Save Function
    async function commitToGithub() {
      const repo = document.getElementById('gh-repo-input').value.trim();
      const token = document.getElementById('gh-token-input').value.trim();
      const title = document.getElementById('note-title-input').value.trim();
      const fileInput = document.getElementById('pdf-file-input');
      const statusEl = document.getElementById('upload-status');

      if (!repo || !token || !title || !fileInput.files.length) {
        alert('Please fill out all fields and select a PDF note.');
        return;
      }

      // Automatically store repo and token permanently in local storage
      localStorage.setItem('lumina_repo', repo);
      localStorage.setItem('lumina_pat', token);

      statusEl.textContent = 'Reading PDF file...';
      statusEl.className = 'text-xs text-center py-1 font-mono text-amber-400';
      statusEl.classList.remove('hidden');

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async (e) => {
        try {
          const base64Data = e.target.result;
          const newNote = {
            id: 'note_' + Date.now(),
            title: title,
            date: new Date().toLocaleDateString(),
            pdfBase64: base64Data
          };

          const updatedDatabase = [newNote, ...notesDatabase];
          const updatedJsonString = JSON.stringify(updatedDatabase, null, 2);

          statusEl.textContent = 'Syncing directly with GitHub REST API...';

          let sha = null;
          const getFileUrl = `https://api.github.com/repos/${repo}/contents/notes-data.json`;
          
          const existingRes = await fetch(getFileUrl, {
            headers: { 'Authorization': `token ${token}` }
          });

          if (existingRes.ok) {
            const existingData = await existingRes.json();
            sha = existingData.sha;
          }

          const utf8Bytes = new TextEncoder().encode(updatedJsonString);
          let binary = '';
          utf8Bytes.forEach((b) => binary += String.fromCharCode(b));
          const base64Content = btoa(binary);

          const putRes = await fetch(getFileUrl, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Publish Lumina Note: ${title}`,
              content: base64Content,
              sha: sha || undefined
            })
          });

          if (putRes.ok) {
            statusEl.textContent = 'Successfully saved and synced to GitHub!';
            statusEl.className = 'text-xs text-center py-1 font-mono text-emerald-400';
            setTimeout(() => {
              closeAdminModal();
              loadNotesData();
            }, 1200);
          } else {
            const errData = await putRes.json();
            throw new Error(errData.message || 'GitHub Sync Failed');
          }

        } catch (err) {
          statusEl.textContent = 'Error: ' + err.message;
          statusEl.className = 'text-xs text-center py-1 font-mono text-rose-400';
        }
      };

      reader.readAsDataURL(file);
    }

    function showLoading(show, text = "") {
      document.getElementById('loading-spinner').style.display = show ? 'flex' : 'none';
      if (text) document.getElementById('loading-text').textContent = text;
      document.getElementById('book-container').classList.toggle('hidden', show);
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('reader-controls').classList.toggle('hidden', show);
    }

    function showEmptyState() {
      document.getElementById('loading-spinner').style.display = 'none';
      document.getElementById('book-container').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('reader-controls').classList.add('hidden');
    }
  </script>
</body>
</html>
