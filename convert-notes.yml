name: Convert uploaded notes
on:
  push:
    paths:
      - "uploads/**/*.pdf"
      - "data/notes.json"
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Convert new PDFs into page images
        shell: python
        run: |
          import json, os, subprocess, pathlib, re
          p=pathlib.Path("data/notes.json")
          notes=json.loads(p.read_text())
          changed=False
          for n in notes:
              if n.get("status")=="processing" and n.get("source") and pathlib.Path(n["source"]).exists():
                  pdf=pathlib.Path(n["source"])
                  out=pathlib.Path("notes")/n["subject"]/n["id"]
                  out.mkdir(parents=True,exist_ok=True)
                  subprocess.run(["pdftoppm","-jpeg","-r","120",str(pdf),str(out/"page")],check=True)
                  imgs=sorted(out.glob("page-*.jpg"))
                  n["pages"]=[str(x).replace("\\","/") for x in imgs]
                  n["status"]="published"
                  changed=True
          if changed:
              p.write_text(json.dumps(notes,indent=2,ensure_ascii=False)+"\n")
      - name: Commit generated pages
        run: |
          git config user.name "notesbook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes data/notes.json
          git diff --cached --quiet || git commit -m "Convert notes to readable pages"
          git push
          
